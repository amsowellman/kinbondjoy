<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Base — Family</title>
<meta name="description" content="Knowledge Base — the family's shared library of know-how and answers. Coming soon.">
<style>
  :root {
    --ink: #2b2b40;
    --paper: #fffaf3;
    --gold: #f5b942;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: linear-gradient(180deg, var(--paper) 0%, #fdf3e0 100%);
    color: var(--ink);
    line-height: 1.6;
  }
  header { text-align: center; padding: 60px 20px 30px; }
  h1 { font-size: clamp(2.2rem, 6vw, 3.4rem); color: var(--gold); }
  main { max-width: 820px; margin: 0 auto; padding: 20px 24px 60px; text-align: center; }
  .soon {
    font-style: italic;
    font-size: 1.2rem;
    opacity: 0.85;
    background: #fff;
    border-radius: 14px;
    padding: 26px 22px;
    box-shadow: 0 4px 14px rgba(43,43,64,0.08);
  }
  .back {
    display: inline-block;
    margin-top: 30px;
    color: var(--gold);
    text-decoration: none;
    font-weight: bold;
  }
  .back:hover { text-decoration: underline; }
  footer { text-align: center; padding: 30px 16px; font-size: 0.9rem; opacity: 0.7; }
</style>
</head>
<body>
<header>
  <h1>Knowledge Base</h1>
</header>
<main>
  <p class="soon">Coming soon — the family's shared library of know-how and answers.</p>
  <a class="back" href="/">← Back home</a>
</main>
<footer>
  Family · built at home, meant for everywhere · est. 2026
</footer>
</body>
</html>
